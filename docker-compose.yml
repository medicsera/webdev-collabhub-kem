services:
  # База данных PostgreSQL 16 с pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collabhub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabhub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-collabhub_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - collabhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabhub_user} -d ${POSTGRES_DB:-collabhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ИИ-микросервис на FastAPI
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: collabhub-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env
    networks:
      - collabhub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collabhub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    networks:
      - collabhub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgres://collabhub_user:collabhub_secret@postgres:5432/collabhub_db
      - AI_SERVICE_URL=http://ai-service:8001
    networks:
      - collabhub-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  collabhub-network:
    driver: bridge

volumes:
  pgdata:
    driver: local